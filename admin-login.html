<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f1f3f5}.box{max-width:420px;margin:10vh auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 30px #0001}</style></head>
<body><div class="box"><h3 class="mb-4 text-center">Admin Login</h3>
<form id="loginForm"><input id="email" type="email" class="form-control mb-3" placeholder="Admin Email" required>
<input id="password" type="password" class="form-control mb-3" placeholder="Password" required>
<button class="btn btn-dark w-100">Login</button></form><div id="msg" class="mt-3 text-danger"></div></div>
<script type="module">
import {auth} from "./firebase-config.js";
import {signInWithEmailAndPassword,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
onAuthStateChanged(auth,u=>{if(u) location.href="admin.html";});
loginForm.addEventListener("submit",async e=>{e.preventDefault();msg.textContent="Logging in...";
try{await signInWithEmailAndPassword(auth,email.value,password.value);location.href="admin.html";}
catch(err){msg.textContent=err.message;}});
</script></body></html>
