<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f6f8}.wrap{max-width:1100px}.preview{width:110px;height:65px;object-fit:cover;border-radius:7px}.card{border:0}.busy{opacity:.6;pointer-events:none}</style></head>
<body>
<nav class="navbar bg-dark navbar-dark"><div class="container wrap"><span class="navbar-brand">Admin Dashboard</span><div><a href="index.html" target="_blank" class="btn btn-sm btn-outline-light me-2">View Site</a><button id="logout" class="btn btn-sm btn-warning">Logout</button></div></div></nav>
<main class="container wrap py-4">
<div class="card shadow-sm mb-4"><div class="card-body"><h4 id="formTitle">Add New Slide</h4>
<form id="slideForm" class="row g-3">
<div class="col-md-6"><label class="form-label">Image</label><input id="image" type="file" accept="image/*" class="form-control"></div>
<div class="col-md-6"><label class="form-label">Name</label><input id="name" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Date</label><input id="date" type="date" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">Day</label><input id="day" class="form-control" readonly></div>
<div class="col-md-4"><label class="form-label">Start Time</label><input id="startTime" type="time" class="form-control" required></div>
<div class="col-md-4"><label class="form-label">End Time</label><input id="endTime" type="time" class="form-control" required></div>
<div class="col-md-8"><label class="form-label">Subject</label><input id="subject" class="form-control" required></div>
<div class="col-12"><button class="btn btn-primary" id="submitBtn">Upload Slide</button><button type="button" class="btn btn-secondary ms-2 d-none" id="cancelBtn">Cancel Edit</button></div>
<div class="col-12"><div id="status"></div></div>
</form></div></div>
<div class="card shadow-sm"><div class="card-body"><h4>Uploaded Slides</h4><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Image</th><th>Name</th><th>Date</th><th>Time</th><th>Subject</th><th>Action</th></tr></thead><tbody id="list"></tbody></table></div></div></div>
</main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {collection,addDoc,getDocs,query,orderBy,doc,updateDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

let currentId=null,currentImageUrl="";
const CLOUD_NAME="y6kr5fnv",UPLOAD_PRESET="medical";
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
onAuthStateChanged(auth,u=>{if(!u) location.href="admin-login.html"; else loadSlides();});
logout.onclick=()=>signOut(auth);

date.addEventListener("change",()=>{if(date.value){day.value=new Date(date.value+"T00:00:00").toLocaleDateString("en-US",{weekday:"long"});}});
function resetForm(){slideForm.reset();day.value="";currentId=null;currentImageUrl="";formTitle.textContent="Add New Slide";submitBtn.textContent="Upload Slide";cancelBtn.classList.add("d-none");}
cancelBtn.onclick=resetForm;

async function uploadImage(file){
 const fd=new FormData(); fd.append("file",file); fd.append("upload_preset",UPLOAD_PRESET);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:"POST",body:fd});
 if(!r.ok) throw new Error("Cloudinary upload failed. Check cloud name/upload preset.");
 const data=await r.json(); return data.secure_url;
}
slideForm.addEventListener("submit",async e=>{
 e.preventDefault(); status.innerHTML='<div class="alert alert-info">Saving...</div>'; submitBtn.disabled=true;
 try{
   let imageUrl=currentImageUrl;
   if(image.files[0]) imageUrl=await uploadImage(image.files[0]);
   if(!imageUrl) throw new Error("Please choose an image.");
   const data={imageUrl,name:name.value.trim(),day:day.value,date:date.value,startTime:startTime.value,endTime:endTime.value,subject:subject.value.trim(),updatedAt:serverTimestamp()};
   if(currentId) await updateDoc(doc(db,"slides",currentId),data);
   else await addDoc(collection(db,"slides"),{...data,createdAt:serverTimestamp()});
   status.innerHTML='<div class="alert alert-success">Saved successfully.</div>'; resetForm(); await loadSlides();
 }catch(err){console.error(err);status.innerHTML='<div class="alert alert-danger">'+esc(err.message)+'</div>';}
 finally{submitBtn.disabled=false;}
});
async function loadSlides(){
 list.innerHTML='<tr><td colspan="6">Loading...</td></tr>';
 try{
  const snap=await getDocs(query(collection(db,"slides"),orderBy("createdAt","desc")));
  list.innerHTML="";
  snap.forEach(d=>{
   const p=d.data(); const tr=document.createElement("tr");
   tr.innerHTML=`<td><img class="preview" src="${esc(p.imageUrl)}"></td><td>${esc(p.name)}</td><td>${esc(p.date)}</td><td>${esc(p.startTime)} - ${esc(p.endTime)}</td><td>${esc(p.subject)}</td><td><button class="btn btn-sm btn-outline-primary edit">Edit</button> <button class="btn btn-sm btn-outline-danger delete">Delete</button></td>`;
   tr.querySelector(".edit").onclick=()=>editSlide(d.id,p);
   tr.querySelector(".delete").onclick=()=>removeSlide(d.id);
   list.appendChild(tr);
  });
  if(snap.empty) list.innerHTML='<tr><td colspan="6">No slides uploaded.</td></tr>';
 }catch(e){list.innerHTML='<tr><td colspan="6" class="text-danger">Error: '+esc(e.message)+'</td></tr>';}
}
function editSlide(id,p){
 currentId=id;currentImageUrl=p.imageUrl||"";
 formTitle.textContent="Edit Slide";submitBtn.textContent="Update Slide";cancelBtn.classList.remove("d-none");
 name.value=p.name||"";date.value=p.date||"";day.value=p.day||"";startTime.value=p.startTime||"";endTime.value=p.endTime||"";subject.value=p.subject||"";
 window.scrollTo({top:0,behavior:"smooth"});
}
async function removeSlide(id){
 if(!confirm("Are you sure you want to delete this slide?")) return;
 try{await deleteDoc(doc(db,"slides",id));await loadSlides();status.innerHTML='<div class="alert alert-success">Slide deleted.</div>';}
 catch(e){status.innerHTML='<div class="alert alert-danger">'+esc(e.message)+'</div>';}
}
</script></body></html>
