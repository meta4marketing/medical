<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Gallery</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{margin:0;background:#f8f9fa}
.carousel-item{height:min(65vh,560px);min-height:320px;background:#111;position:relative}
.carousel-item img{width:100%;height:100%;object-fit:cover;opacity:.82}
.slide-overlay{position:absolute;left:0;right:0;bottom:0;padding:70px 8% 45px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.slide-overlay h2{font-weight:700;margin-bottom:8px}.slide-meta{font-size:1rem}.slide-subject{font-size:1.15rem;font-weight:600;margin-top:8px}
.empty{min-height:350px;display:flex;align-items:center;justify-content:center;color:#777}
</style>
</head>
<body>
<div id="carousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
  <div id="indicators" class="carousel-indicators"></div>
  <div id="slides" class="carousel-inner"></div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
  <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
</div>
<div id="empty" class="empty">Loading slides...</div>
<script type="module">
import { db } from "./firebase-config.js";
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const slidesEl=document.getElementById("slides"), indEl=document.getElementById("indicators"), empty=document.getElementById("empty");
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

try{
 const snap=await getDocs(query(collection(db,"slides"),orderBy("createdAt","desc")));
 if(snap.empty){empty.textContent="No slides uploaded yet."; document.getElementById("carousel").style.display="none";}
 else{
   empty.style.display="none";
   snap.forEach((doc,i)=>{
     const p=doc.data();
     indEl.insertAdjacentHTML("beforeend",`<button type="button" data-bs-target="#carousel" data-bs-slide-to="${i}" class="${i===0?"active":""}"></button>`);
     slidesEl.insertAdjacentHTML("beforeend",`
       <div class="carousel-item ${i===0?"active":""}">
         <img src="${esc(p.imageUrl)}" alt="${esc(p.name)}">
         <div class="slide-overlay">
           <h2>${esc(p.name)}</h2>
           <div class="slide-meta">${esc(p.day)} &nbsp;|&nbsp; ${esc(p.date)} &nbsp;|&nbsp; ${esc(p.startTime)} - ${esc(p.endTime)}</div>
           <div class="slide-subject">${esc(p.subject)}</div>
         </div>
       </div>`);
   });
 }
}catch(e){console.error(e);empty.textContent="Unable to load slides. Check Firestore Rules and configuration.";}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
